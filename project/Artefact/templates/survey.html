<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Survey and Recommendations</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card:hover {
            background-color: #f8f9fa;
            cursor: pointer;
        }
        .card:hover .form-check-label {
            color: #007bff;
        }
        .selected-card {
            background-color: #007bff;
            color: white;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let answers = [];
        let questionIndex = 0;
        const questions = [
            { id: "name", question: "What is your name?", type: "text" },
            { id: "age", question: "How old are you?", type: "number" },
            { id: "enjoysMovies", question: "Do you enjoy watching movies?", type: "boolean" },
            { id: "plot", question: "Which type of movie do you prefer right now?", options: ["A heartwarming, feel-good story", "An intense emotional journey that makes you reflect", "A thrilling adventure that excites you", "A lighthearted comedy that makes you laugh"], ratings: [2, 6, 9, 1] },
            { id: "pace", question: "Which mood do you feel like experiencing through a movie?", options: ["Uplifting and empowering", "Bittersweet and emotionally complex", "Light and carefree with lots of humor", "Deep and thought-provoking with a serious tone"], ratings: [3, 7, 1, 8] },
            { id: "mood", question: "What kind of ending are you in the mood for?", options: ["A happy, fulfilling resolution", "A tragic yet impactful conclusion", "An open-ended, thought-provoking finale", "A surprising twist that leaves you shocked"], ratings: [3, 7, 6, 9] },
            { id: "setting", question: "How do you want to feel after watching a movie?", options: ["Inspired and motivated to take action", "Emotional and reflective on life's meaning", "Energized and excited by a thrilling plot", "Relaxed and uplifted with a good laugh"], ratings: [8, 7, 9, 1] },
            { id: "genre", question: "What kind of atmosphere do you want from your film tonight?", options: ["Cozy and warm, full of love and positivity", "Deep and heavy, filled with raw emotion", "Fun and silly, with moments of pure joy", "Intense and dramatic, with high stakes"], ratings: [1, 8, 2, 9] },
        ];

        function nextQuestion() {
            if (questionIndex < questions.length) {
                const currentQuestion = questions[questionIndex];
                document.getElementById("questionLabel").innerText = currentQuestion.question;
                const optionsContainer = document.getElementById("optionsContainer");
                optionsContainer.innerHTML = "";

                if (currentQuestion.type === "text" || currentQuestion.type === "number") {
                    optionsContainer.innerHTML = `
                        <div class="col-md-12 mb-3">
                            <input type="${currentQuestion.type}" class="form-control" id="answerInput">
                        </div>
                    `;
                } else if (currentQuestion.type === "boolean") {
                    optionsContainer.innerHTML = `
                        <div class="col-md-12 mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="option" id="optionYes" value="true">
                                <label class="form-check-label" for="optionYes">Yes</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="option" id="optionNo" value="false">
                                <label class="form-check-label" for="optionNo">No</label>
                            </div>
                        </div>
                    `;
                } else {
                    currentQuestion.options.forEach((option, index) => {
                        const optionElement = document.createElement("div");
                        optionElement.classList.add("col-md-12", "mb-3");
                        optionElement.innerHTML = `
                            <div class="card h-100" onclick="selectOption(${index})">
                                <div class="card-body d-flex align-items-center justify-content-center">
                                    <input class="form-check-input me-2" type="radio" name="option" id="option${index}" value="${currentQuestion.ratings[index]}" style="display: none;">
                                    <label class="form-check-label w-100 h-100 d-flex align-items-center justify-content-center" for="option${index}" onclick="selectOption(${index})">${option}</label>
                                </div>
                            </div>
                        `;
                        optionsContainer.appendChild(optionElement);
                    });
                }
            } else {
                document.getElementById("surveySection").style.display = "none";
                document.getElementById("resultSection").style.display = "block";
                recommendMovie();
            }
        }

        function selectOption(index) {
            document.querySelectorAll('.card').forEach(card => {
                card.classList.remove('selected-card');
            });
            const selectedCard = document.getElementById(`option${index}`).closest('.card');
            selectedCard.classList.add('selected-card');
            document.getElementById(`option${index}`).checked = true;
        }

        function storeAnswer() {
            const currentQuestion = questions[questionIndex];
            let answer;

            if (currentQuestion.type === "text" || currentQuestion.type === "number") {
                answer = document.getElementById("answerInput").value;
                if (currentQuestion.type === "number") {
                    answer = parseInt(answer);
                }
            } else if (currentQuestion.type === "boolean") {
                const selectedOption = document.querySelector('input[name="option"]:checked');
                if (selectedOption) {
                    answer = selectedOption.value === "true";
                } else {
                    alert("Please select an option.");
                    return;
                }
            } else {
                const selectedOption = document.querySelector('input[name="option"]:checked');
                if (selectedOption) {
                    answer = parseInt(selectedOption.value);
                } else {
                    alert("Please select an option.");
                    return;
                }
            }

            answers.push(answer);
            questionIndex++;
            nextQuestion();
        }

        function recommendMovie() {
            const averageRating = answers.reduce((a, b) => a + b, 0) / answers.length;

            const movies = JSON.parse('{{ movies | tojson | safe }}');

            const recommendations = movies.filter(movie => {
                if (averageRating <= 2) {
                    return movie['genre'].toLowerCase().includes("comedy") || movie['genre'].toLowerCase().includes("romantic");
                } else if (averageRating <= 4) {
                    return movie['genre'].toLowerCase().includes("drama") || movie['genre'].toLowerCase().includes("historical");
                } else {
                    return movie['genre'].toLowerCase().includes("action") || movie['genre'].toLowerCase().includes("intense");
                }
            }).slice(0, 9); // Limit to 9 recommendations

            const result = document.getElementById("result");
            result.innerHTML = "";

            if (recommendations.length > 0) {
                recommendations.forEach(movie => {
                    const movieElement = document.createElement("div");
                    movieElement.classList.add("col-md-4", "mb-4");
                    movieElement.innerHTML = `
                        <a href="https://www.themoviedb.org/movie/${movie['tmdb_id']}" target="_blank" class="text-decoration-none text-dark">
                            <div class="card h-100">
                                <div class="card-body">
                                    <h5 class="card-title">${movie['title']} (${movie['release_year']})</h5>
                                    <p class="card-text">IMDb Rating: ${movie['rating']}</p>
                                    <p class="card-text">Genre: ${movie['genre']}</p>
                                    <p class="card-text">Gross Earnings: $${movie['gross(M)']}M</p>
                                </div>
                            </div>
                        </a>
                    `;
                    result.appendChild(movieElement);
                });
            } else {
                result.innerHTML = "<p>No movies found based on your preferences. Please try again with different criteria.</p>";
            }
        }

        function retakeSurvey() {
            answers = [];
            questionIndex = 0;
            document.getElementById("surveySection").style.display = "block";
            document.getElementById("resultSection").style.display = "none";
            nextQuestion();
        }

        document.addEventListener("DOMContentLoaded", nextQuestion);
    </script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('home') }}">CineTrends</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('analytics') }}">Analytics</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('survey') }}">Survey</a>
            </div>
        </div>
    </nav>

    <div class="card text-bg-warning text-warning w-100 p-0.5 rounded-0">0</div>

    <div class="card text-center bg-dark text-light rounded-0">
      <div class="card-header">
        <h5>Find Your Next Movie!</h5>
      </div>
    </div>

    <main class="container mt-5">
        <div id="surveySection" class="row g-5">
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-body d-flex align-items-center justify-content-center">
                        <h2 id="questionLabel"></h2>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <form id="surveyForm" onsubmit="event.preventDefault(); storeAnswer();">
                    <div class="row g-3" id="optionsContainer"></div><br>
                    <button type="submit" class="btn btn-primary w-100">Next</button>
                </form>
            </div>
        </div>

        <div id="resultSection" class="row g-5" style="display: none;">
            <h2 class="mt-5">Recommended Movies</h2>
            <div id="result" class="row"></div>
            <button class="btn btn-secondary w-100 mt-3" onclick="retakeSurvey()">Retake Survey</button>
        </div>
    </main>
</body>
</html>
